name: Windows build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build read-only NTFS helper
        shell: cmd
        run: |
          if not exist native\bin mkdir native\bin
          cl /nologo /EHsc /std:c++17 /W4 /O2 /Fe:native\bin\diskatlas-ntfs.exe native\ntfs.cpp
          if errorlevel 1 exit /b 1
          native\bin\diskatlas-ntfs.exe --self-test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Validate real isolated NTFS volume
        shell: pwsh
        run: ./scripts/test-windows-volume.ps1
      - name: Validate three-million-entry index
        run: node --import tsx scripts/benchmark-index.ts
      - run: npm run build
      - run: npm run test:e2e
      - name: Package installer and portable
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Install Windows package silently
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'DiskAtlasInstalled'
          $installer = Join-Path $env:GITHUB_WORKSPACE 'release/DiskAtlas-Setup-0.1.0.exe'
          $process = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$target" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          if (!(Test-Path (Join-Path $target 'DiskAtlas.exe'))) { throw 'Installed executable is missing' }
      - name: Validate installed application
        run: npm run test:e2e
        env:
          DISKATLAS_EXECUTABLE: ${{ runner.temp }}/DiskAtlasInstalled/DiskAtlas.exe
      - name: Validate portable application launch
        shell: pwsh
        run: |
          $portable = Join-Path $env:GITHUB_WORKSPACE 'release/DiskAtlas-0.1.0-win-x64-portable.exe'
          $env:DISKATLAS_USER_DATA = Join-Path $env:RUNNER_TEMP 'DiskAtlasPortableSmoke'
          $process = Start-Process -FilePath $portable -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(40)
            $window = $null
            do {
              Start-Sleep -Milliseconds 500
              $window = Get-Process -Name DiskAtlas -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -eq 'DiskAtlas' }
            } until ($window -or (Get-Date) -gt $deadline)
            if (!$window) { throw 'Portable application did not create its window' }
          } finally {
            Get-Process -Name DiskAtlas -ErrorAction SilentlyContinue | Stop-Process -Force
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DiskAtlas-validation
          path: |
            test-results/
            playwright-report/
      - uses: actions/upload-artifact@v4
        with:
          name: DiskAtlas-0.1.0-Windows-x64
          path: release/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DiskAtlas-0.1.0-Windows-x64
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe --repo "$GITHUB_REPOSITORY" --generate-notes
